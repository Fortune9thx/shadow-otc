<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Brand green background, slightly rounded -->
  <rect width="100" height="100" rx="18" fill="#0C3B23"/>

  <!-- ── Paper bag ─────────────────────────────────────── -->
  <!-- Top fold / flap (darker brown) -->
  <path d="M26 20 Q50 14 74 20 L70 34 Q50 28 30 34 Z" fill="#9A6B28"/>

  <!-- Bag body -->
  <path d="M30 34 Q50 28 70 34 L67 72 Q50 77 33 72 Z" fill="#C48B38"/>

  <!-- Subtle center crease -->
  <line x1="50" y1="28" x2="50" y2="74" stroke="#A57230" stroke-width="2.5" opacity="0.45"/>

  <!-- Left edge crease -->
  <line x1="37" y1="30" x2="35" y2="71" stroke="#A57230" stroke-width="1.5" opacity="0.35"/>

  <!-- Right edge crease -->
  <line x1="63" y1="30" x2="65" y2="71" stroke="#A57230" stroke-width="1.5" opacity="0.35"/>

  <!-- ── Eyes ─────────────────────────────────────────── -->
  <!-- Left eye outer ring -->
  <circle cx="39" cy="50" r="10" fill="#2A1500"/>
  <!-- Left eye white -->
  <circle cx="39" cy="50" r="7.5" fill="#FFFFFF"/>

  <!-- Right eye outer ring -->
  <circle cx="61" cy="50" r="10" fill="#2A1500"/>
  <!-- Right eye white -->
  <circle cx="61" cy="50" r="7.5" fill="#FFFFFF"/>

  <!-- ── Torn / jagged bottom of bag ───────────────────── -->
  <path d="M33 72 L38 65 L43 72 L48 65 L52 72 L57 65 L62 72 L67 72"
        fill="none" stroke="#8A5C20" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
